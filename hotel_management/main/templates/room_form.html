{% extends "base.html" %}

{% block content %}
<a class="list-link" href="{% url 'room_list' %}">View all rooms →</a>
<form action="{% url 'room' %}" method="POST">
  {% csrf_token %}
  <fieldset>
    <legend>Room Details</legend>
    <div class="row">
      <div class="field">
        <label>Room Number <span class="req">*</span></label>
        <input type="text" name="room_number" placeholder="e.g. 101" required>
      </div>
      <div class="field">
        <label>Room Category <span class="req">*</span></label>
        <select name="room_category_id" required>
          <option value="" disabled selected>Select Category</option>
          {% for category in categories %}
            <option value="{{ category.0 }}">{{ category.1 }} (${{ category.2 }})</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Room Status <span class="req">*</span></label>
        <select name="room_status" required>
          <option value="available" selected>Available</option>
          <option value="occupied">Occupied</option>
          <option value="maintenance">Maintenance</option>
          <option value="reserved">Reserved</option>
          <option value="pending">Pending</option>
        </select>
      </div>
    </div>
  </fieldset>
  <div class="actions">
    <button type="submit" class="submit">Save Room</button>
    <button type="reset" class="reset">Reset</button>
  </div>
</form>
{% endblock %}
