{% extends "base.html" %}

{% block content %}
<form action="/submit-booking-source" method="POST">
  <fieldset>
    <legend>Booking Source Details</legend>
    <div class="row">
      <div class="field">
        <label>Source Name <span class="req">*</span></label>
        <input type="text" name="source_name" placeholder="Booking.com / Walk-in / Website" required>
      </div>
      <div class="field">
        <label>Source Type <span class="req">*</span></label>
        <select name="source_type" required>
          <option value="" disabled selected>Select Source Type</option>
          <option value="Direct">Direct / Walk-in</option>
          <option value="OTA">Online Travel Agency (OTA)</option>
          <option value="Travel Agency">Travel Agency</option>
          <option value="Corporate">Corporate Partner</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Commission Rate (%)</label>
        <input type="number" step="0.01" name="commission_rate" placeholder="15.00" value="0.00">
      </div>
      <div class="field">
        <label>Contact Person / Email</label>
        <input type="text" name="contact_info" placeholder="contact@agency.com">
      </div>
    </div>
  </fieldset>
  <div class="actions">
    <button type="submit" class="submit">Save Booking Source</button>
    <button type="reset" class="reset">Reset</button>
  </div>
</form>
{% endblock %}
