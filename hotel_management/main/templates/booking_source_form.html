{% extends "base.html" %}

{% block content %}
<form action="{% url 'booking_source' %}" method="POST">
  {% csrf_token %}
  <fieldset>
    <legend>Booking Source Details</legend>
    <div class="row">
      <div class="field full">
        <label>Booking Source Name <span class="req">*</span></label>
        <input type="text" name="name" placeholder="e.g. Booking.com, Walk-in, Website" required>
      </div>
    </div>
  </fieldset>
  <div class="actions">
    <button type="submit" class="submit">Save Booking Source</button>
    <button type="reset" class="reset">Reset</button>
  </div>
</form>
{% endblock %}
