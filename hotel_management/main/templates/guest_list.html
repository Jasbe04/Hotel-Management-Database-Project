{% extends "base.html" %}

{% block content %}
<div class="toolbar">
  <a href="{% url 'guest' %}" class="submit">+ New Guest</a>
</div>

<div style="overflow-x:auto;">
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Guardian</th><th>Age</th>
        <th>Occupation</th><th>Phone</th><th>NID</th><th>Address</th>
      </tr>
    </thead>
    <tbody>
      {% for g in guests %}
      <tr>
        <td>{{ g.0 }}</td>
        <td>{{ g.1 }}</td>
        <td>{{ g.2|default:"—" }}</td>
        <td>{{ g.3 }}</td>
        <td>{{ g.4|default:"—" }}</td>
        <td>{{ g.5 }}</td>
        <td>{{ g.6 }}</td>
        <td>{{ g.7 }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="8" style="text-align:center;">No guests found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
