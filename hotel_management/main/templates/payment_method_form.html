{% extends "base.html" %}

{% block content %}
<a class="list-link" href="{% url 'payment_method_list' %}">View all payment methods →</a>
<form action="{% url 'payment_method' %}" method="POST">
  {% csrf_token %}
  <fieldset>
    <legend>Payment Method Details</legend>
    <div class="row">
      <div class="field full">
        <label>Payment Method Name <span class="req">*</span></label>
        <input type="text" name="payment_method_name" placeholder="e.g. Credit Card, Cash, Bkash" required>
      </div>
    </div>
  </fieldset>
  <div class="actions">
    <button type="submit" class="submit">Save Payment Method</button>
    <button type="reset" class="reset">Reset</button>
  </div>
</form>
{% endblock %}
