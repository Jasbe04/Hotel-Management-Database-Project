{% extends "base.html" %}

{% block content %}
<div class="toolbar">
  <a href="{% url 'category' %}" class="submit">+ New Category</a>
</div>

<div style="overflow-x:auto;">
  <table class="data-table">
    <thead>
      <tr><th>ID</th><th>Category Name</th><th class="num">Rate / Night ($)</th></tr>
    </thead>
    <tbody>
      {% for c in categories %}
      <tr>
        <td>{{ c.0 }}</td>
        <td>{{ c.1 }}</td>
        <td class="num">{{ c.2 }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="3" style="text-align:center;">No categories found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
