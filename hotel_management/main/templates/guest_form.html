{% extends "base.html" %}

{% block content %}
<a class="list-link" href="{% url 'guest_list' %}">View all guests →</a>
<form action="{% url 'guest' %}" method="POST">
  {% csrf_token %}
  <fieldset>
    <legend>Guest Details</legend>
    
    <div class="row">
      <div class="field">
        <label>Guest Name <span class="req">*</span></label>
        <input type="text" name="guest_name" placeholder="Enter guest's name" required>
      </div>
      <div class="field">
        <label>Guardian Name</label>
        <input type="text" name="guardian_name" placeholder="Enter guardian's name">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Age <span class="req">*</span></label>
        <input type="number" name="age" min="1" max="120" placeholder="e.g. 34" required>
      </div>
      <div class="field">
        <label>Occupation</label>
        <input type="text" name="occupation" placeholder="e.g. Engineer">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Phone Number <span class="req">*</span></label>
        <input type="tel" name="phone_number" placeholder="Enter phone number" required>
      </div>
      <div class="field">
        <label>NID Number <span class="req">*</span></label>
        <input type="text" name="nid" placeholder="e.g. 1990123456001" required>
      </div>
    </div>

    <div class="row">
      <div class="field full">
        <label>Address <span class="req">*</span></label>
        <textarea name="address" rows="2" placeholder="e.g. Khulna, Bangladesh" required></textarea>
      </div>
    </div>
  </fieldset>

  <div class="actions">
    <button type="submit" class="submit">Save Guest</button>
    <button type="reset" class="reset">Reset</button>
  </div>
</form>
{% endblock %}
