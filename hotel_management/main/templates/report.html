<!DOCTYPE html>
<html>

<head>
    <title>Revenue Report</title>
</head>

<body>

<h1>Revenue Report</h1>

<!-- Table -->
<table border="1">
    <thead>
        <tr>
            <th>Month</th>
            <th>Revenue</th>
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr>
            <td>{{ row.0 }}</td>
            <td>{{ row.1 }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No revenue data available for 2026.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- Chart -->
<h2>Revenue Chart</h2>

<canvas id="revenueChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// Extract labels and data directly from Django rows
const months = [
    {% for row in rows %}
        "{{ row.0 }}",
    {% endfor %}
];

const income = [
    {% for row in rows %}
        {{ row.1|default:0 }},
    {% endfor %}
];

new Chart(document.getElementById("revenueChart"), {
    type: "bar",
    data: {
        labels: months,
        datasets: [{
            label: "Revenue ($)",
            data: income,
            backgroundColor: "rgba(54, 162, 235, 0.6)",
            borderColor: "rgba(54, 162, 235, 1)",
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
</script>

</body>
</html>
