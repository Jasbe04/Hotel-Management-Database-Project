{% extends "base.html" %}
{% load l10n %}

{% block content %}
<div class="toolbar">
  <a href="{% url 'invoice_list' %}" class="submit">← Back to Invoices</a>
</div>

<h2 style="font-size:18px; color:#1a5276; margin-bottom:12px;">Monthly Revenue Report — {{ year }}</h2>

<div style="overflow-x:auto; margin-bottom:24px;">
  <table class="data-table">
    <thead>
      <tr><th>Month</th><th class="num">Revenue ($)</th></tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <td>{{ row.0 }}</td>
        <td class="num">{{ row.1 }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="2" style="text-align:center;">No revenue data available for {{ year }}.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<h2 style="font-size:18px; color:#1a5276; margin-bottom:12px;">Revenue Chart</h2>
<canvas id="revenueChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const months = [
  {% for row in rows %}"{{ row.0 }}",{% endfor %}
];

const income = [
  {% for row in rows %}{{ row.1|default:0|unlocalize }},{% endfor %}
];

new Chart(document.getElementById("revenueChart"), {
  type: "bar",
  data: {
    labels: months,
    datasets: [{
      label: "Revenue ($)",
      data: income,
      backgroundColor: "rgba(54, 162, 235, 0.6)",
      borderColor: "rgba(54, 162, 235, 1)",
      borderWidth: 1
    }]
  },
  options: {
    responsive: true,
    scales: { y: { beginAtZero: true } }
  }
});
</script>
{% endblock %}
