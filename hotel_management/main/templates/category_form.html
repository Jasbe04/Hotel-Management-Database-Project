{% extends "base.html" %}

{% block content %}
<a class="list-link" href="{% url 'category_list' %}">View all categories →</a>
<form action="{% url 'category' %}" method="POST">
  {% csrf_token %}
  <fieldset>
    <legend>Room Category Details</legend>
    <div class="row">
      <div class="field">
        <label>Room Category Name <span class="req">*</span></label>
        <input type="text" name="room_category_name" placeholder="e.g. Deluxe Double" required>
      </div>
      <div class="field">
        <label>Rate per Night ($) <span class="req">*</span></label>
        <input type="number" step="0.01" min="0" name="rate" placeholder="e.g. 150.00" required>
      </div>
    </div>
  </fieldset>
  <div class="actions">
    <button type="submit" class="submit">Save Category</button>
    <button type="reset" class="reset">Reset</button>
  </div>
</form>
{% endblock %}
